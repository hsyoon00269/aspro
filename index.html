<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASPRO 방송복 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[data-theme="dark"]{
  --bg:#17150f;--surface:#211f19;--surface2:#2e2b23;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.13);
  --gold:#c9a84c;--gold-dim:#a8893a;--gold-pale:#e8dcb8;
  --cream:#e2dbcc;--cream2:#d6cdb8;--muted:#948a78;
  --ghost:rgba(201,168,76,0.12);--input-bg:rgba(255,255,255,0.04);
  --header-bg:rgba(23,21,15,0.93);--add-row:rgba(255,255,255,0.02);
  --shadow:0 2px 10px rgba(0,0,0,0.22);
  --se-bg:rgba(201,168,76,0.05);--se-border:rgba(201,168,76,0.22);
  --size-cell:#2e2b23;--size-border:rgba(255,255,255,0.07);
  --cnt-bg:rgba(255,255,255,0.05);--cnt-border:rgba(255,255,255,0.10);
  --chip-bg:rgba(255,255,255,0.04);--chip-border:rgba(255,255,255,0.08);
  --btn-del-c:rgba(255,255,255,0.18);--brand-hover:rgba(255,255,255,0.03);
  --knob:#c9a84c;--knob-x:0px;
  --season-bg:#1c1a15;
  --c-season:#3ea0e6;--c-season-bg:rgba(62,160,230,0.16);--c-season-bg2:rgba(62,160,230,0.28);
  --c-product:#e84a97;--c-product-bg:rgba(232,74,151,0.14);--c-product-bg2:rgba(232,74,151,0.26);
  --c-set:#e2971a;--c-set-bg:rgba(226,151,26,0.15);--c-set-bg2:rgba(226,151,26,0.27);
  --c-color:#22c47a;--c-color-bg:rgba(34,196,122,0.15);--c-color-bg2:rgba(34,196,122,0.27);
}
[data-theme="light"]{
  --bg:#f6f4f0;--surface:#ffffff;--surface2:#eeece7;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.13);
  --gold:#9a6f28;--gold-dim:#7a5518;--gold-pale:#5a3e0a;
  --cream:#332e26;--cream2:#453f34;--muted:#8a8070;
  --ghost:rgba(154,111,40,0.10);--input-bg:rgba(0,0,0,0.03);
  --header-bg:rgba(246,244,240,0.95);--add-row:rgba(0,0,0,0.02);
  --shadow:0 2px 12px rgba(0,0,0,0.06);
  --se-bg:rgba(154,111,40,0.05);--se-border:rgba(154,111,40,0.22);
  --size-cell:#f8f6f2;--size-border:rgba(0,0,0,0.07);
  --cnt-bg:rgba(0,0,0,0.04);--cnt-border:rgba(0,0,0,0.09);
  --chip-bg:rgba(0,0,0,0.03);--chip-border:rgba(0,0,0,0.07);
  --btn-del-c:rgba(0,0,0,0.20);--brand-hover:rgba(0,0,0,0.025);
  --knob:#9a6f28;--knob-x:20px;
  --season-bg:#f8f6f2;
  --c-season:#0d7dc9;--c-season-bg:rgba(13,125,201,0.16);--c-season-bg2:rgba(13,125,201,0.28);
  --c-product:#e0217a;--c-product-bg:rgba(224,33,122,0.14);--c-product-bg2:rgba(224,33,122,0.26);
  --c-set:#d98a0a;--c-set-bg:rgba(217,138,10,0.15);--c-set-bg2:rgba(217,138,10,0.27);
  --c-color:#0fa858;--c-color-bg:rgba(15,168,88,0.15);--c-color-bg2:rgba(15,168,88,0.27);
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--cream);min-height:100vh;padding-bottom:80px;line-height:1.5;font-weight:500}

/* THEME TRANSITION: 개별 요소 트랜지션 대신 View Transition API로 화면 전체를 한 번에 크로스페이드 처리 (끊김 방지) */
::view-transition-old(root),::view-transition-new(root){animation-duration:.32s;animation-timing-function:ease}
@media (prefers-reduced-motion: reduce){::view-transition-old(root),::view-transition-new(root){animation-duration:.001s}}

[data-theme="dark"] body{background-image:radial-gradient(ellipse 60% 40% at 80% 0%,rgba(201,168,76,0.04) 0%,transparent 60%),radial-gradient(ellipse 40% 30% at 10% 100%,rgba(201,168,76,0.025) 0%,transparent 50%)}

/* SYNC BAR */
.sync-bar{height:3px;background:transparent;position:fixed;top:0;left:0;right:0;z-index:999}
.sync-bar-fill{height:100%;width:0;background:var(--gold);transition:width .3s,opacity .6s;border-radius:0 2px 2px 0}
.sync-bar-fill.on{width:70%}
.sync-bar-fill.done{width:100%;opacity:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* HEADER */
.header{position:sticky;top:0;z-index:200;background:var(--header-bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--border2);padding:0 20px}
.header-inner{max-width:760px;margin:0 auto;padding:16px 0 0}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{display:flex;align-items:baseline;gap:10px}
.logo-text{font-family:'DM Serif Display',serif;font-size:26px;letter-spacing:4px;color:var(--gold)}
.logo-sub{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);font-weight:300}
.hdr-right{display:flex;align-items:center;gap:12px}
.sync-pill{display:flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s}
.sync-dot.live{background:#2ecc71;box-shadow:0 0 6px rgba(46,204,113,0.5)}
.sync-dot.saving{background:var(--gold);animation:pulse .8s infinite}
.sync-dot.err{background:#e74c3c}
.theme-btn{width:46px;height:26px;border-radius:13px;border:1px solid var(--border2);background:var(--surface2);cursor:pointer;position:relative;flex-shrink:0;display:flex;align-items:center;padding:0 4px;justify-content:space-between}
.theme-ico{font-size:11px;pointer-events:none;z-index:1}
.theme-knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--knob);transform:translateX(var(--knob-x));transition:transform .25s}

/* ADD BAR */
.add-bar{display:flex;gap:8px;margin-bottom:14px}
.add-bar input{flex:1;height:42px;background:var(--input-bg);border:1px solid var(--border2);border-radius:12px;color:var(--cream);font-family:inherit;font-size:13px;padding:0 14px;outline:none;transition:border-color .2s}
.add-bar input::placeholder{color:var(--muted)}
.add-bar input:focus{border-color:var(--gold)}
.btn-gold{height:42px;padding:0 18px;background:var(--gold);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:opacity .15s,transform .1s}
[data-theme="dark"] .btn-gold{color:#0e0d0b}
.btn-gold:hover{opacity:.88}
.btn-gold:active{transform:scale(.97)}

/* TABS */
.tabs{display:flex}
.tab-btn{flex:1;height:40px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.tab-btn:hover{color:var(--cream2)}
.tab-btn.on{color:var(--gold);border-bottom-color:var(--gold)}
.badge{background:var(--ghost);border:1px solid rgba(154,111,40,0.3);color:var(--gold);font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px;min-width:20px;text-align:center}

/* MAIN */
.main{max-width:760px;margin:0 auto;padding:20px 20px 0}
.pane{display:none}
.pane.on{display:block}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;animation:up .4s ease}
.empty-ico{font-size:36px;margin-bottom:12px}
.empty-ttl{font-family:'DM Serif Display',serif;font-size:18px;color:var(--cream2);margin-bottom:6px}
.empty-dsc{font-size:12px;color:var(--muted);line-height:1.8}

/* BRAND */
.brand{background:var(--surface);border:1px solid var(--border);border-radius:18px;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow);animation:up .3s ease;transition:border-color .2s}
.brand:hover{border-color:var(--border2)}
.brand-hdr{display:flex;align-items:center;padding:16px 18px;cursor:pointer;gap:12px;user-select:none;transition:background .15s}
.brand-hdr:hover{background:var(--brand-hover)}
.b-chev{width:22px;height:22px;border:1px solid rgba(154,111,40,0.35);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:9px;flex-shrink:0;transition:transform .3s,background .2s}
.b-chev.op{transform:rotate(180deg);background:var(--ghost)}
.b-info{flex:1;min-width:0}
.b-name{font-family:'DM Serif Display',serif;font-size:18px;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-meta{font-size:11px;color:var(--muted);margin-top:2px}
.b-badge{background:var(--ghost);border:1px solid rgba(154,111,40,0.3);color:var(--gold);font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;white-space:nowrap}
.btn-del-b{background:none;border:1px solid var(--border2);color:var(--muted);border-radius:8px;padding:5px 10px;font-family:inherit;font-size:11px;cursor:pointer;flex-shrink:0;transition:all .15s}
.btn-del-b:hover{background:rgba(192,57,43,0.10);color:#e74c3c;border-color:rgba(192,57,43,0.4)}
.brand-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1);border-top:0 solid var(--border)}
.brand-body.op{max-height:999999px;border-top-width:1px}

/* ADD ROW (공통: 시즌/제품/컬러 추가 입력줄) */
.add-row{display:flex;gap:8px;padding:12px 16px;background:var(--add-row)}
.add-row input{flex:1;height:38px;background:var(--input-bg);border:1px solid var(--border);border-radius:12px;color:var(--cream);font-family:inherit;font-size:13px;padding:0 12px;outline:none;transition:border-color .15s}
.add-row input::placeholder{color:var(--muted)}
.add-row input:focus{border-color:var(--gold)}
.btn-add-sm{height:38px;padding:0 14px;background:var(--ghost);color:var(--gold);border:1px solid rgba(154,111,40,0.3);border-radius:12px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn-add-sm:hover{opacity:.75}

/* SEASON (파란 계열 강조 — 브랜드/제품과 구분) */
.season{border-top:1px solid var(--border);background:var(--season-bg);border-left:5px solid var(--c-season)}
.season-hdr{display:flex;align-items:center;gap:8px;padding:13px 16px;cursor:pointer;user-select:none;background:var(--c-season-bg);flex-wrap:wrap;row-gap:6px}
.se-chev{width:18px;height:18px;border:1px solid var(--c-season);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--c-season);font-size:8px;flex-shrink:0;transition:transform .3s}
.se-chev.op{transform:rotate(180deg)}
.se-name{font-size:14px;font-weight:800;color:var(--c-season);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.se-meta{font-size:11px;color:var(--muted)}
.se-tag{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--c-season);background:var(--c-season-bg2);border-radius:5px;padding:2px 6px;flex-shrink:0}
.btn-del-se{background:none;border:1px solid var(--border2);color:var(--muted);border-radius:7px;padding:4px 8px;font-family:inherit;font-size:10px;cursor:pointer}
.btn-del-se:hover{color:#e74c3c;border-color:rgba(192,57,43,0.4)}
.season-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.season-body.op{max-height:999999px;border-top:1px solid var(--border)}

/* PRODUCT (로즈 계열 강조) */
.prod-item{border-top:1px solid var(--border);animation:up .25s ease;border-left:5px solid var(--c-product)}
.prod-hdr{display:flex;align-items:center;gap:7px;padding:13px 16px;cursor:pointer;user-select:none;background:var(--c-product-bg);flex-wrap:wrap;row-gap:6px}
.p-chev{width:16px;height:16px;border:1px solid var(--c-product);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--c-product);font-size:8px;flex-shrink:0;transition:transform .3s}
.p-chev.op{transform:rotate(180deg)}
.prod-dot{width:6px;height:6px;border-radius:50%;background:var(--c-product);opacity:.85;flex-shrink:0}
.prod-name{flex:1;font-size:14px;font-weight:700;color:var(--c-product);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod-badge{font-size:10px;color:var(--c-product);background:var(--c-product-bg2);border:1px solid transparent;border-radius:20px;padding:2px 8px;white-space:nowrap;font-weight:700}
.btn-sz-edit{padding:4px 9px;background:none;border:1px solid var(--border);border-radius:7px;color:var(--muted);font-family:inherit;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-sz-edit:hover,.btn-sz-edit.on{color:var(--gold);border-color:rgba(154,111,40,0.4);background:var(--ghost)}
.btn-del-p{width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:none;border:none;border-radius:7px;font-size:17px;color:var(--btn-del-c);cursor:pointer;transition:all .15s;flex-shrink:0}
.btn-del-p:hover{color:#e74c3c;background:rgba(192,57,43,0.10)}
.prod-body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 16px}
.prod-body.op{max-height:999999px;padding:0 16px 14px}

/* SIZE EDITOR */
.sz-editor{overflow:hidden;max-height:0;transition:max-height .25s ease,opacity .2s;opacity:0}
.sz-editor.on{max-height:600px;opacity:1;margin-bottom:12px}
.sz-editor-in{background:var(--se-bg);border:1px dashed var(--se-border);border-radius:12px;padding:10px 12px}
.sz-grp{margin-bottom:10px}
.sz-grp:last-child{margin-bottom:0}
.sz-ed-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold-dim);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sz-ed-lbl .hint{font-size:9px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400}
.sz-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.sz-tag{display:inline-flex;align-items:center;gap:4px;background:var(--ghost);border:1px solid rgba(154,111,40,0.3);border-radius:6px;padding:3px 4px 3px 6px;font-size:12px;font-weight:500;color:var(--gold-pale);cursor:grab}
.sz-tag.dragging{opacity:.35}
.sz-tag .grip{color:var(--muted);font-size:10px}
.sz-tag-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0 2px;transition:color .15s}
.sz-tag-del:hover{color:#e74c3c}
.sz-add-row{display:flex;gap:6px}
.sz-add-row input{width:90px;height:30px;background:var(--input-bg);border:1px solid var(--se-border);border-radius:7px;color:var(--cream);font-family:inherit;font-size:13px;text-align:center;outline:none}
.sz-add-row input:focus{border-color:var(--gold)}
.btn-sz-add{height:30px;padding:0 12px;background:var(--ghost);color:var(--gold);border:1px solid rgba(154,111,40,0.35);border-radius:7px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer}

/* SET SUMMARY (앰버 계열 강조 — 세트는 컬러/사이즈와 구분되는 별도 패널) */
.set-summary{background:var(--c-set-bg);border:1px solid var(--c-set);border-radius:14px;padding:12px 12px 4px;margin-bottom:14px}
.set-summary-hdr{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--c-set);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px}
.set-grp-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:0 0 6px;font-weight:600}
.set-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
@media(max-width:480px){.set-grid,.sz-grid,.msz-grid{grid-template-columns:repeat(2,1fr)}}
.set-cell{background:var(--size-cell);border:1px solid var(--c-set);border-radius:10px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.set-cell .sl{font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--muted)}
.set-cell .sv{font-family:'DM Serif Display',serif;font-size:22px;color:var(--c-set);line-height:1}
.set-cell .sv.zero{color:var(--muted)}
.set-btns{display:flex;gap:5px;margin-top:2px}
.btn-cut,.btn-set-add{font-size:10px;padding:3px 9px;border-radius:6px;cursor:pointer;font-family:inherit;white-space:nowrap;font-weight:600}
.btn-cut{border:1px solid rgba(192,57,43,0.35);background:rgba(192,57,43,0.08);color:#e74c3c}
.btn-set-add{border:1px solid rgba(46,204,113,0.4);background:rgba(46,204,113,0.10);color:#27ae60}
.btn-cut:disabled{opacity:.3;cursor:not-allowed}
.set-empty{font-size:11px;color:var(--muted);text-align:center;padding:10px}

/* COLOR ADD */
.color-add{display:flex;gap:8px;margin-bottom:10px}
.color-add input{flex:1;height:36px;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;color:var(--cream);font-family:inherit;font-size:13px;padding:0 12px;outline:none}
.color-add input:focus{border-color:var(--gold)}
.btn-color-add{height:36px;padding:0 12px;background:var(--ghost);color:var(--gold);border:1px solid rgba(154,111,40,0.3);border-radius:10px;font-family:inherit;font-size:12px;cursor:pointer;white-space:nowrap}

/* COLOR BLOCK (그린 계열 강조 — 세트 패널과 뚜렷이 구분) */
.color-block{border:1px solid var(--c-color);border-left:5px solid var(--c-color);border-radius:14px;margin-bottom:10px;overflow:hidden}
.color-hdr{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--c-color-bg);cursor:pointer;flex-wrap:wrap;row-gap:5px}
.c-chev{width:15px;height:15px;border:1px solid var(--c-color);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--c-color);font-size:7px;flex-shrink:0;transition:transform .3s}
.c-chev.op{transform:rotate(180deg)}
.color-swatch{width:10px;height:10px;border-radius:50%;background:var(--c-color);flex-shrink:0}
.color-name{flex:1;font-size:13px;font-weight:800;color:var(--c-color);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.color-total{font-size:11px;color:var(--muted)}
.btn-del-c2{width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:none;border:none;border-radius:6px;font-size:15px;color:var(--btn-del-c);cursor:pointer}
.btn-del-c2:hover{color:#e74c3c;background:rgba(192,57,43,0.10)}
.color-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.color-body.op{max-height:99999px;padding:10px 12px}

/* SIZES GRID */
.sz-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.sz-grid:last-child{margin-bottom:0}
.sz-cell{background:var(--size-cell);border:1px solid var(--size-border);border-radius:12px;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:border-color .2s}
.sz-cell:hover{border-color:rgba(154,111,40,0.3)}
.sz-lbl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.sz-cnt{font-family:'DM Serif Display',serif;font-size:26px;color:var(--cream);line-height:1;min-height:32px;display:flex;align-items:center;transition:color .15s}
.sz-cnt.hi{color:var(--gold)}
.cnt-btns{display:flex;gap:5px}
.btn-cnt{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--cnt-bg);border:1px solid var(--cnt-border);border-radius:10px;color:var(--muted);font-size:14px;cursor:pointer;transition:all .15s}
.btn-cnt.up:hover{background:rgba(39,174,96,0.15);color:#2ecc71;border-color:rgba(39,174,96,0.35)}
.btn-cnt.dn:hover{background:rgba(192,57,43,0.15);color:#e74c3c;border-color:rgba(192,57,43,0.35)}
.btn-cnt:active{transform:scale(.9)}

<script>
/* ═══════════════════════════════
   FIREBASE INIT
═══════════════════════════════ */
firebase.initializeApp({
  apiKey:"AIzaSyAoJ2-GLNLcUjQXMnkW0JOVQoD8UeL8yAY",
  authDomain:"aspro-darabase.firebaseapp.com",
  databaseURL:"https://aspro-darabase-default-rtdb.firebaseio.com",
  projectId:"aspro-darabase",
  storageBucket:"aspro-darabase.firebasestorage.app",
  messagingSenderId:"768389338295",
  appId:"1:768389338295:web:1f581fcc4bf3b09b272932"
});
const db = firebase.database();
const ROOT = db.ref('aspro');

/*
  데이터 구조 (v2)
  brands: [{
    id, name,
    seasons: [{
      id, name,           // 예: "26FW"
      products: [{
        id, name,
        colors: [{id,name}],
        sizesRegular: [사이즈명...],   // 정사이즈 (예: 55,66,77,88)
        sizesExtended: [사이즈명...],  // 키움사이즈 (예: 55+3, 55+6)
        counts: { [colorId]: { [사이즈명]: 수량 } }
      }]
    }]
  }]
  logs: [{id,dt,brandName,seasonName,productName,colorName,changes:[{sz,before,after,delta}],reason}]
*/

/* ═══════════════════════════════
   STATE
═══════════════════════════════ */
let brands = [];
let logs   = [];
let expanded   = {};   // id -> bool  (brand/season/product/color 공용, uid는 전역 유니크)
let sizeEdit   = {};   // productId -> bool
let sInputs    = {};   // brandId -> 시즌명 입력값
let pInputs    = {};   // seasonId -> 제품명 입력값
let cInputs    = {};   // productId -> 컬러명 입력값
let mSession   = null;  // 비고 탭 진행 중인 조정 세션: {bid,seid,pid,cid,changes:{sz:{before,after}}}
let editingLogId = null;
let saveTimer = null;
let quickLog = {};       // key -> {before,bid,seid,pid,cid,sz}
let quickLogTimer = {};  // key -> timeout id
let dragCtx = null;      // 사이즈 드래그 재정렬 상태

/* ═══════════════════════════════
   SYNC UI
═══════════════════════════════ */
function syncUI(s){
  const dot=document.getElementById('sdot');
  const txt=document.getElementById('stxt');
  const bar=document.getElementById('sbar');
  if(s==='live'){dot.className='sync-dot live';txt.textContent='실시간 연결됨';bar.className='sync-bar-fill done';setTimeout(()=>bar.className='sync-bar-fill',700);}
  else if(s==='saving'){dot.className='sync-dot saving';txt.textContent='저장 중...';bar.className='sync-bar-fill on';}
  else if(s==='err'){dot.className='sync-dot err';txt.textContent='연결 오류';}
  else{dot.className='sync-dot';txt.textContent='연결 중...';}
}

/* ═══════════════════════════════
   FIREBASE SAVE
═══════════════════════════════ */
function save(){
  clearTimeout(saveTimer);
  syncUI('saving');
  saveTimer=setTimeout(()=>{
    ROOT.set({brands,logs})
      .then(()=>syncUI('live'))
      .catch(()=>syncUI('err'));
  },400);
}

/* ═══════════════════════════════
   구버전 데이터 자동 마이그레이션
   구버전: brand.products = [{id,name,sizes:[...],counts:{sz:qty}}]
   신버전: brand.seasons  = [{id,name,products:[{...,colors,sizesRegular,sizesExtended,counts:{colorId:{sz:qty}}}]}]
═══════════════════════════════ */
function migrate(){
  let changed=false;
  brands.forEach(b=>{
    if(!b.seasons){
      const oldProducts = b.products || [];
      b.seasons = oldProducts.length ? [{id:uid(),name:'시즌 미지정',products:oldProducts}] : [];
      delete b.products;
      changed = true;
    }
    (b.seasons||[]).forEach(se=>{
      (se.products||[]).forEach(p=>{
        if(!p.colors){
          const oldSizes = p.sizes || [];
          const oldCounts = p.counts || {};
          const cid = uid();
          p.colors = [{id:cid,name:'기본'}];
          const regular=[], extended=[];
          oldSizes.forEach(s=> (String(s).includes('+') ? extended : regular).push(s));
          p.sizesRegular = regular;
          p.sizesExtended = extended;
          p.counts = {};
          p.counts[cid] = {};
          oldSizes.forEach(s=> p.counts[cid][s] = oldCounts[s]||0);
          delete p.sizes;
          changed = true;
        } else {
          if(!p.sizesRegular){ p.sizesRegular = []; changed = true; }
          if(!p.sizesExtended){ p.sizesExtended = []; changed = true; }
          if(!p.counts){ p.counts = {}; changed = true; }
        }
      });
    });
  });
  return changed;
}

/* ═══════════════════════════════
   FIREBASE LISTEN (실시간)
═══════════════════════════════ */
ROOT.on('value', snap=>{
  const d=snap.val();
  brands = (d&&d.brands) ? d.brands : [];
  logs   = (d&&d.logs)   ? d.logs   : [];
  const changed = migrate();
  syncUI('live');
  updateBadge();
  renderStock();
  renderLogs();
  if(document.getElementById('paneMemo').classList.contains('on')) refreshSelects();
  if(changed) save();
});

/* ═══════════════════════════════
   THEME (View Transition API로 크로스페이드 → 끊김 방지)
═══════════════════════════════ */
function getTheme(){ try{return localStorage.getItem('aspro_theme')||'dark';}catch(e){return'dark';} }
function applyTheme(t){ document.documentElement.setAttribute('data-theme',t); try{localStorage.setItem('aspro_theme',t);}catch(e){} }
function setTheme(t){
  if(document.startViewTransition){ document.startViewTransition(()=>applyTheme(t)); }
  else{ applyTheme(t); }
}
document.getElementById('themeBtn').addEventListener('click',()=>{
  setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
});
applyTheme(getTheme());

/* ═══════════════════════════════
   HELPERS
═══════════════════════════════ */
function uid(){ return '_'+Math.random().toString(36).slice(2,9); }
function pad(n){ return String(n).padStart(2,'0'); }
function now(){
  const d=new Date();
  return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function mk(tag,cls){ const e=document.createElement(tag); if(cls)e.className=cls; return e; }
function updateBadge(){ document.getElementById('logBadge').textContent=logs.length; }

function findBrand(bid){ return brands.find(x=>x.id===bid); }
function findSeason(bid,seid){ const b=findBrand(bid); return b&&(b.seasons||[]).find(x=>x.id===seid); }
function findProduct(bid,seid,pid){ const se=findSeason(bid,seid); return se&&(se.products||[]).find(x=>x.id===pid); }
function findColor(bid,seid,pid,cid){ const p=findProduct(bid,seid,pid); return p&&(p.colors||[]).find(x=>x.id===cid); }
function allSizes(p){ return [...(p.sizesRegular||[]),...(p.sizesExtended||[])]; }

function colorCount(p,cid,sz){ return ((p.counts||{})[cid]||{})[sz]||0; }
function totalColorStock(p,cid){ return allSizes(p).reduce((s,sz)=>s+colorCount(p,cid,sz),0); }
function totalProductStock(p){ return (p.colors||[]).reduce((s,c)=>s+totalColorStock(p,c.id),0); }
function totalSeasonStock(se){ return (se.products||[]).reduce((s,p)=>s+totalProductStock(p),0); }
function totalBrandStock(b){ return (b.seasons||[]).reduce((s,se)=>s+totalSeasonStock(se),0); }
function setCountFor(p,sz){
  const colors=p.colors||[];
  if(!colors.length) return 0;
  return Math.min(...colors.map(c=>colorCount(p,c.id,sz)));
}
function totalSetStock(p){ return allSizes(p).reduce((s,sz)=>s+setCountFor(p,sz),0); }

/* ═══════════════════════════════
   SIZE (정사이즈 / 키움사이즈)
═══════════════════════════════ */
function addSize(bid,seid,pid,group){
  const inp=document.getElementById('sinp_'+group+'_'+pid); if(!inp)return;
  const val=inp.value.trim(); if(!val){return;}
  const p=findProduct(bid,seid,pid); if(!p)return;
  if(!p[group])p[group]=[];
  if(allSizes(p).includes(val)){ inp.value=''; return; }
  p[group].push(val);
  if(!p.counts)p.counts={};
  (p.colors||[]).forEach(c=>{ if(!p.counts[c.id])p.counts[c.id]={}; p.counts[c.id][val]=0; });
  inp.value=''; save();
}
function deleteSize(bid,seid,pid,group,sz){
  const p=findProduct(bid,seid,pid); if(!p)return;
  p[group]=(p[group]||[]).filter(s=>s!==sz);
  (p.colors||[]).forEach(c=>{ if(p.counts&&p.counts[c.id]) delete p.counts[c.id][sz]; });
  save();
}
function renameSize(bid,seid,pid,group,oldName){
  const p=findProduct(bid,seid,pid); if(!p)return;
  const name=prompt('사이즈명 수정',oldName); if(name===null)return;
  const t=name.trim(); if(!t||t===oldName)return;
  if(allSizes(p).includes(t)){ alert('이미 있는 사이즈예요.'); return; }
  const idx=(p[group]||[]).indexOf(oldName); if(idx===-1)return;
  p[group][idx]=t;
  (p.colors||[]).forEach(c=>{
    if(p.counts&&p.counts[c.id]&&Object.prototype.hasOwnProperty.call(p.counts[c.id],oldName)){
      p.counts[c.id][t]=p.counts[c.id][oldName];
      delete p.counts[c.id][oldName];
    }
  });
  save();
}
function reorderSize(bid,seid,pid,group,fromIdx,toIdx){
  const p=findProduct(bid,seid,pid); if(!p||!p[group])return;
  if(fromIdx===toIdx||fromIdx==null||toIdx==null)return;
  const arr=p[group];
  const [item]=arr.splice(fromIdx,1);
  arr.splice(toIdx,0,item);
  save();
}

/* ═══════════════════════════════
   COUNT 변경 (컬러 × 사이즈, 자동 로그 기록)
═══════════════════════════════ */
function changeColorCount(bid,seid,pid,cid,sz,delta){
  const p=findProduct(bid,seid,pid); if(!p)return;
  if(!p.counts)p.counts={};
  if(!p.counts[cid])p.counts[cid]={};
  const key=pid+'_'+cid+'_'+sz;
  if(!quickLog[key]) quickLog[key]={before:p.counts[cid][sz]||0,bid,seid,pid,cid,sz};
  p.counts[cid][sz]=Math.max(0,(p.counts[cid][sz]||0)+delta);
  clearTimeout(quickLogTimer[key]);
  quickLogTimer[key]=setTimeout(()=>finalizeQuickLog(key),1200);
  save();
}
function finalizeQuickLog(key){
  const rec=quickLog[key]; delete quickLog[key]; if(!rec)return;
  const b=findBrand(rec.bid); const se=findSeason(rec.bid,rec.seid);
  const p=findProduct(rec.bid,rec.seid,rec.pid); const c=findColor(rec.bid,rec.seid,rec.pid,rec.cid);
  if(!b||!se||!p||!c)return;
  const after=colorCount(p,rec.cid,rec.sz);
  if(after!==rec.before){
    logs.unshift({id:uid(),dt:now(),brandName:b.name,seasonName:se.name,productName:p.name,colorName:c.name,
      changes:[{sz:rec.sz,before:rec.before,after,delta:after-rec.before}],reason:''});
    save();
  }
}

/* ═══════════════════════════════
   세트 차감 (컬러별로 동시에 1장씩 차감)
═══════════════════════════════ */
function cutSet(bid,seid,pid,sz){
  const b=findBrand(bid); const se=findSeason(bid,seid); const p=findProduct(bid,seid,pid);
  if(!b||!se||!p)return;
  const colors=p.colors||[]; if(!colors.length)return;
  const setQty=setCountFor(p,sz);
  if(setQty<=0)return;
  if(!p.counts)p.counts={};
  const changes=[];
  colors.forEach(c=>{
    if(!p.counts[c.id])p.counts[c.id]={};
    const before=p.counts[c.id][sz]||0;
    const after=Math.max(0,before-1);
    p.counts[c.id][sz]=after;
    changes.push({sz:`${c.name} · ${sz}`,before,after,delta:after-before});
  });
  logs.unshift({id:uid(),dt:now(),brandName:b.name,seasonName:se.name,productName:p.name,colorName:'세트',
    changes,reason:'세트 1개 차감'});
  save();
}

/* ═══════════════════════════════
   세트 추가 (컬러별로 동시에 1장씩 추가)
═══════════════════════════════ */
function addSet(bid,seid,pid,sz){
  const b=findBrand(bid); const se=findSeason(bid,seid); const p=findProduct(bid,seid,pid);
  if(!b||!se||!p)return;
  const colors=p.colors||[]; if(!colors.length)return;
  if(!p.counts)p.counts={};
  const changes=[];
  colors.forEach(c=>{
    if(!p.counts[c.id])p.counts[c.id]={};
    const before=p.counts[c.id][sz]||0;
    const after=before+1;
    p.counts[c.id][sz]=after;
    changes.push({sz:`${c.name} · ${sz}`,before,after,delta:after-before});
  });
  logs.unshift({id:uid(),dt:now(),brandName:b.name,seasonName:se.name,productName:p.name,colorName:'세트',
    changes,reason:'세트 1개 추가'});
  save();
}

/* ═══════════════════════════════
   사이즈 태그 드래그 재정렬
═══════════════════════════════ */
function bindSizeDrag(tagEl,bid,seid,pid,group,idx){
  tagEl.draggable=true;
  tagEl.addEventListener('dragstart',e=>{
    dragCtx={bid,seid,pid,group,idx};
    tagEl.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';
  });
  tagEl.addEventListener('dragend',()=>{ tagEl.classList.remove('dragging'); dragCtx=null; });
  tagEl.addEventListener('dragover',e=>{ e.preventDefault(); });
  tagEl.addEventListener('drop',e=>{
    e.preventDefault();
    if(!dragCtx||dragCtx.group!==group||dragCtx.pid!==pid)return;
    reorderSize(bid,seid,pid,group,dragCtx.idx,idx);
  });
}

  }
  [['sizesRegular','정사이즈'],['sizesExtended','키움사이즈']].forEach(([group,label])=>{

function renderStock(){

    main.appendChild(es); return;
  }
  brands.forEach(brand=>{
    const isOpen=!!expanded[brand.id];
    const block=mk('div','brand');
    const hdr=mk('div','brand-hdr');
    hdr.addEventListener('click',()=>toggleBrand(brand.id));
    const chev=mk('span','b-chev'+(isOpen?' op':'')); chev.textContent='▾';

    const nm=mk('div','b-name'); nm.textContent=brand.name;

    info.appendChild(nm); info.appendChild(meta);
    const badge2=mk('span','b-badge'); badge2.textContent=`재고 ${totalBrandStock(brand)}`;
    const editB=mk('button','btn-edit-name'); editB.textContent='✎'; editB.title='이름 수정';
    editB.addEventListener('click',e=>{ e.stopPropagation(); renameBrand(brand.id); });
    const delB=mk('button','btn-del-b'); delB.textContent='삭제';
    delB.addEventListener('click',e=>{ e.stopPropagation(); deleteBrand(brand.id); });
    hdr.appendChild(chev); hdr.appendChild(info); hdr.appendChild(badge2); hdr.appendChild(editB); hdr.appendChild(delB);
    block.appendChild(hdr);

    const body=mk('div','brand-body'+(isOpen?' op':''));
    const addRow=mk('div','add-row');
    const sInp=mk('input'); sInp.type='text'; sInp.placeholder='시즌 입력 (예: 26FW)';
    sInp.value=sInputs[brand.id]||'';
    sInp.addEventListener('input',e=>{ sInputs[brand.id]=e.target.value; });
    sInp.addEventListener('keydown',e=>{ if(e.key==='Enter')addSeason(brand.id); });
    const sAddBtn=mk('button','btn-add-sm'); sAddBtn.textContent='+ 시즌 추가';
    sAddBtn.addEventListener('click',()=>addSeason(brand.id));

    (brand.seasons||[]).forEach(season=>{
      const seOpen=!!expanded[season.id];

      seHdr.addEventListener('click',()=>toggleSeason(season.id));
      const seChev=mk('span','se-chev'+(seOpen?' op':'')); seChev.textContent='▾';
      const seName=mk('div','se-name'); seName.textContent=season.name;
      const seMeta=mk('span','se-meta'); seMeta.textContent=`제품 ${(season.products||[]).length}종 · 재고 ${totalSeasonStock(season)}`;
      const seEdit=mk('button','btn-edit-name'); seEdit.textContent='✎'; seEdit.title='시즌명 수정';
      seEdit.addEventListener('click',e=>{ e.stopPropagation(); renameSeason(brand.id,season.id); });
      const seDel=mk('button','btn-del-se'); seDel.textContent='삭제';
      seDel.addEventListener('click',e=>{ e.stopPropagation(); deleteSeason(brand.id,season.id); });
      const seTag=mk('span','se-tag'); seTag.textContent='시즌';
      seHdr.appendChild(seChev); seHdr.appendChild(seTag); seHdr.appendChild(seName); seHdr.appendChild(seMeta); seHdr.appendChild(seEdit); seHdr.appendChild(seDel);
      seBlock.appendChild(seHdr);

          cHdr.appendChild(cChev);

          const cName=mk('span','color-name'); cName.textContent=color.name;
          const cTotal=mk('span','color-total'); cTotal.textContent=`재고 ${totalColorStock(product,color.id)}`;
          const cEdit=mk('button','btn-edit-name'); cEdit.textContent='✎'; cEdit.title='컬러명 수정';
          cEdit.addEventListener('click',e=>{ e.stopPropagation(); renameColor(brand.id,season.id,product.id,color.id); });
          const cDel=mk('button','btn-del-c2'); cDel.textContent='×';
          cDel.addEventListener('click',e=>{ e.stopPropagation(); deleteColor(brand.id,season.id,product.id,color.id); });
          cHdr.appendChild(cName); cHdr.appendChild(cTotal); cHdr.appendChild(cEdit); cHdr.appendChild(cDel);
          cBlock.appendChild(cHdr);
          const cBody=mk('div','color-body'+(cOpen?' op':''));
          cBody.appendChild(renderColorSizeGrid(brand.id,season.id,product.id,product,color));
          cBlock.appendChild(cBody);
          pBody.appendChild(cBlock);
        });

        item.appendChild(pBody);
        seBody.appendChild(item);
      });

      seBlock.appendChild(seBody);
      body.appendChild(seBlock);
    });

    block.appendChild(body); main.appendChild(block);
  });
}

/* ═══════════════════════════════
   비고 탭: +/-를 누르면 즉시 실제 재고에 1씩 반영.
   같은 컬러를 보고 있는 동안의 변경들을 모아뒀다가,
   다른 항목을 선택하거나 '적용'을 누르면 사유와 함께 기록 1건으로 저장합니다.
═══════════════════════════════ */
function memoChangeCount(bid,seid,pid,cid,sz,delta){
  const p=findProduct(bid,seid,pid); if(!p)return;
  if(!p.counts)p.counts={};
  if(!p.counts[cid])p.counts[cid]={};
  if(!mSession||mSession.bid!==bid||mSession.seid!==seid||mSession.pid!==pid||mSession.cid!==cid){
    mSession={bid,seid,pid,cid,changes:{}};
  }
  if(!mSession.changes[sz]) mSession.changes[sz]={before:p.counts[cid][sz]||0};
  const next=Math.max(0,(p.counts[cid][sz]||0)+delta);
  p.counts[cid][sz]=next;
  mSession.changes[sz].after=next;
  save();
  renderMemoSizes(p,cid);
}
function finalizeMemoSession(){
  const reason=(document.getElementById('mReason')||{}).value||'';
  const trimmedReason=reason.trim();
  if(!mSession){
    return;
  }
  const b=findBrand(mSession.bid); const se=findSeason(mSession.bid,mSession.seid);
  const p=findProduct(mSession.bid,mSession.seid,mSession.pid); const c=findColor(mSession.bid,mSession.seid,mSession.pid,mSession.cid);
  const changes=Object.entries(mSession.changes)
    .filter(([sz,v])=>v.after!==undefined&&v.after!==v.before)
    .map(([sz,v])=>({sz,before:v.before,after:v.after,delta:v.after-v.before}));
  mSession=null;
  if(!b||!se||!p||!c){ return; }
  if(changes.length===0&&!trimmedReason){ return; }
  logs.unshift({id:uid(),dt:now(),brandName:b.name,seasonName:se.name,productName:p.name,colorName:c.name,changes,reason:trimmedReason});
  document.getElementById('mReason').value='';
  save();
}

function renderMemoSizes(product,cid){
  const wrap=document.getElementById('mszGroups'); wrap.innerHTML='';
  const bid=document.getElementById('mBrand').value;
  const seid=document.getElementById('mSeason').value;
  const pid=document.getElementById('mProduct').value;
  [['sizesRegular','정사이즈'],['sizesExtended','키움사이즈']].forEach(([group,label])=>{
    const list=product[group]||[]; if(!list.length)return;
    const gl=mk('div','set-grp-lbl'); gl.textContent=label; wrap.appendChild(gl);
    const grid=mk('div','msz-grid');
    list.forEach(sz=>{
      const cur=colorCount(product,cid,sz);
      const cell=mk('div','msz-cell');
      const lbl=mk('div','msz-lbl2'); lbl.textContent=sz;
      const cntDiv=mk('div','msz-cnt'); cntDiv.textContent=cur;
      const iw=mk('div','msz-inp-wrap');
      const mb=mk('button','btn-sign minus'); mb.textContent='−';
      mb.addEventListener('click',()=>memoChangeCount(bid,seid,pid,cid,sz,-1));
      const pb=mk('button','btn-sign plus'); pb.textContent='+';
      pb.addEventListener('click',()=>memoChangeCount(bid,seid,pid,cid,sz,1));
      iw.appendChild(mb); iw.appendChild(cntDiv); iw.appendChild(pb);
      cell.appendChild(lbl); cell.appendChild(iw);
      grid.appendChild(cell);
    });
    wrap.appendChild(grid);
  });
}

function deleteLog(lid){
  if(!confirm('이 변경 기록을 삭제할까요? 삭제하면 되돌릴 수 없어요.'))return;
  logs=logs.filter(l=>l.id!==lid); if(editingLogId===lid)editingLogId=null; save();
}
function startEditLog(lid){ editingLogId=(editingLogId===lid)?null:lid; renderLogs(); }
function saveLogReason(lid){
  const ta=document.getElementById('eta_'+lid); if(!ta)return;
  const log=logs.find(l=>l.id===lid); if(!log)return;
  log.reason=ta.value.trim(); editingLogId=null; save();
}
function cancelEdit(){ editingLogId=null; renderLogs(); }

/* ═══════════════════════════════
   RENDER LOGS
═══════════════════════════════ */
function renderLogs(){
  const list=document.getElementById('logList'); list.innerHTML='';
  if(!logs.length){ const e=mk('div','log-empty'); e.textContent='아직 변경 기록이 없어요.'; list.appendChild(e); return; }
  logs.forEach(log=>{
    const item=mk('div','log-item');
    const acts=mk('div','log-acts');
    const eb=mk('button','log-btn edit'); eb.title='편집'; eb.textContent='✏️'; eb.addEventListener('click',()=>startEditLog(log.id));
    const db2=mk('button','log-btn del'); db2.title='삭제'; db2.textContent='🗑'; db2.addEventListener('click',()=>deleteLog(log.id));
    acts.appendChild(eb); acts.appendChild(db2); item.appendChild(acts);
    const meta=mk('div','log-meta');
    const dt=mk('span','log-dt'); dt.textContent=log.dt; meta.appendChild(dt);
    if(log.brandName){ const bt=mk('span','log-btag'); bt.textContent=log.brandName; meta.appendChild(bt); }
    if(log.seasonName){ const st=mk('span','log-ptag'); st.textContent=log.seasonName; meta.appendChild(st); }
    if(log.productName){ const pt=mk('span','log-ptag'); pt.textContent=log.productName; meta.appendChild(pt); }
    if(log.colorName){ const ct=mk('span','log-ptag'); ct.textContent=log.colorName; meta.appendChild(ct); }
    item.appendChild(meta);
    if(log.changes&&log.changes.length){
      const chips=mk('div','log-chips');
      log.changes.forEach(c=>{ const ch=mk('span','log-chip'+(c.delta>0?' pos':' neg')); ch.textContent=`${c.sz}: ${c.before}→${c.after} (${c.delta>0?'+':''}${c.delta})`; chips.appendChild(ch); });
      item.appendChild(chips);
    }
    const isEd=(editingLogId===log.id);
    const view=mk('div','log-reason-view');
    if(log.reason) view.textContent=log.reason;
    else{ view.textContent='(사유 없음)'; view.classList.add('log-reason-none'); }
    if(isEd)view.style.display='none';
    item.appendChild(view);
    const editArea=mk('div','log-reason-edit'+(isEd?' on':''));
    const ta=mk('textarea','log-edit-ta'); ta.id='eta_'+log.id; ta.value=log.reason||''; ta.placeholder='사유를 입력하세요';
    ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.ctrlKey)saveLogReason(log.id); });
    const ract=mk('div','log-edit-acts');
    const sv=mk('button','btn-save-r'); sv.textContent='저장'; sv.addEventListener('click',()=>saveLogReason(log.id));
    const cc=mk('button','btn-cancel-r'); cc.textContent='취소'; cc.addEventListener('click',cancelEdit);
    ract.appendChild(cc); ract.appendChild(sv);
    editArea.appendChild(ta); editArea.appendChild(ract); item.appendChild(editArea);
    list.appendChild(item);
    if(isEd)setTimeout(()=>{ const t=document.getElementById('eta_'+log.id); if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);} },40);
  });
}

/* ═══════════════════════════════
   엑셀 다운로드 / 업로드
   시트 "재고" 컬럼: 브랜드 | 시즌 | 제품 | 컬러 | 사이즈구분 | 사이즈 | 수량
   업로드 시 같은 이름 조합이 있으면 수량을 갱신하고, 없으면 브랜드/시즌/제품/컬러/사이즈를 새로 만들어 추가합니다.
   (엑셀에서 지운 행이 있어도 앱에서 자동으로 삭제되지는 않습니다.)
═══════════════════════════════ */
function exportExcel(){
  const rows=[['브랜드','시즌','제품','컬러','사이즈구분','사이즈','수량']];
  brands.forEach(b=>{
    (b.seasons||[]).forEach(se=>{
      (se.products||[]).forEach(p=>{
        (p.colors||[]).forEach(c=>{
          (p.sizesRegular||[]).forEach(sz=> rows.push([b.name,se.name,p.name,c.name,'정사이즈',sz,colorCount(p,c.id,sz)]) );
          (p.sizesExtended||[]).forEach(sz=> rows.push([b.name,se.name,p.name,c.name,'키움사이즈',sz,colorCount(p,c.id,sz)]) );
        });
      });
    });
  });
  if(rows.length===1){ alert('내보낼 재고 데이터가 없어요.'); return; }
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:16},{wch:10},{wch:22},{wch:14},{wch:10},{wch:10},{wch:8}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'재고');
  const d=new Date();
  const fname=`ASPRO_재고_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.xlsx`;
  XLSX.writeFile(wb,fname);
}
document.getElementById('btnExportXlsx').addEventListener('click',exportExcel);

function exportLogsExcel(){
  if(!logs.length){ alert('내보낼 변경 기록이 없어요.'); return; }
  const rows=[['날짜','브랜드','시즌','제품','컬러','변경내역','사유']];
  logs.forEach(log=>{
    const changeText=(log.changes&&log.changes.length)
      ? log.changes.map(c=>`${c.sz} ${c.before}→${c.after}(${c.delta>0?'+':''}${c.delta})`).join(', ')
      : '';
    rows.push([log.dt||'',log.brandName||'',log.seasonName||'',log.productName||'',log.colorName||'',changeText,log.reason||'']);
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:16},{wch:14},{wch:10},{wch:20},{wch:12},{wch:40},{wch:30}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'비고');
  const d=new Date();
  const fname=`ASPRO_비고_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.xlsx`;

}

document.getElementById('btnImportXlsx').addEventListener('click',()=>{
  document.getElementById('xlsxFile').click();
});
document.getElementById('xlsxFile').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=evt=>{
    try{
      const data=new Uint8Array(evt.target.result);
      const wb=XLSX.read(data,{type:'array'});
      const sheetName=wb.SheetNames.includes('재고')?'재고':wb.SheetNames[0];
      const ws=wb.Sheets[sheetName];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
      importExcelRows(rows);
    }catch(err){
      alert('엑셀 파일을 읽는 중 오류가 발생했어요. 파일 형식을 확인해주세요.');
    }
    e.target.value='';
  };
  reader.readAsArrayBuffer(file);
});

function importExcelRows(rows){
  if(!rows||rows.length<2){ alert('읽을 데이터가 없어요.'); return; }
  let updated=0, created=0, skipped=0;
  for(let i=1;i<rows.length;i++){
    const row=rows[i]; if(!row||!row.length)continue;
    const [brandName,seasonName,productName,colorName,groupLabel,sizeName,qtyRaw]=row;
    if(!brandName||!seasonName||!productName||!colorName||!sizeName){ skipped++; continue; }
    const qty=parseInt(qtyRaw,10);
    if(isNaN(qty)||qty<0){ skipped++; continue; }
    const group=(String(groupLabel||'').trim()==='키움사이즈')?'sizesExtended':'sizesRegular';

    let b=brands.find(x=>x.name===String(brandName).trim());
    if(!b){ b={id:uid(),name:String(brandName).trim(),seasons:[]}; brands.push(b); }

    let se=(b.seasons||[]).find(x=>x.name===String(seasonName).trim());
    if(!se){ se={id:uid(),name:String(seasonName).trim(),products:[]}; if(!b.seasons)b.seasons=[]; b.seasons.push(se); }

    let p=(se.products||[]).find(x=>x.name===String(productName).trim());
    if(!p){ p={id:uid(),name:String(productName).trim(),colors:[],sizesRegular:[],sizesExtended:[],counts:{}}; if(!se.products)se.products=[]; se.products.push(p); }

    let c=(p.colors||[]).find(x=>x.name===String(colorName).trim());
    if(!c){ c={id:uid(),name:String(colorName).trim()}; if(!p.colors)p.colors=[]; p.colors.push(c); if(!p.counts)p.counts={}; p.counts[c.id]={}; }

    const szName=String(sizeName).trim();
    if(!p[group])p[group]=[];
    if(!p[group].includes(szName)) p[group].push(szName);
    if(!p.counts)p.counts={};
    if(!p.counts[c.id])p.counts[c.id]={};

    const before=p.counts[c.id][szName]||0;
    p.counts[c.id][szName]=qty;
    if(before!==qty) updated++; else created++;
  }
  save();
  alert(`엑셀 반영 완료: 수량 변경 ${updated}건, 변동 없음 ${created}건${skipped?`, 건너뜀 ${skipped}건`:''}`);
}

/* INIT */
updateBadge();
renderStock();
renderLogs();
</script>
